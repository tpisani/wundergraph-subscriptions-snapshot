name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test (unit + in-process router integration, with race detector)
        run: go test -race -count=1 ./...

      - name: Build router
        run: go build -trimpath -o /dev/null ./cmd/router

  testdata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate router execution config
        run: ./scripts/generate-testdata.sh

      - name: Ensure testdata is up to date
        run: git diff --exit-code -- snapshot/testdata

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 -t router-snapshot:ci .
