# yaml-language-server: $schema=https://raw.githubusercontent.com/wundergraph/cosmo/main/router/pkg/config/config.schema.json
version: "1"

# Subgraphs that serve subscriptions must use SSE towards the router:
#   npx wgc subgraph publish sports --subscription-protocol sse_post ...
# (or `subscription: { protocol: sse_post }` in a local graph.yaml).
# Clients can keep using graphql-ws, SSE or multipart.

# Never put secrets in this file in plain text; use environment variables.

modules:
  subscriptionSnapshot:
    # Client request headers that identify who may see a snapshot. A client only
    # receives a snapshot recorded for the same operation, variables AND values
    # of these headers. Default: [Authorization]. An explicit [] disables header
    # keys (only for subscriptions whose data is identical for every client).
    key_headers:
      - Authorization
      # - X-Tenant-Id
    # Subscription operation names that get a snapshot. Empty = all.
    operations: []
    # Discard snapshots older than this (Go duration). Empty or "0" = never.
    # Snapshots are always dropped when the upstream stream ends.
    ttl: ""
    # Maximum number of stored snapshots (LRU). 0 = default (10000), -1 = unbounded.
    max_entries: 10000
    # Maximum total size of stored snapshots in bytes (LRU).
    # 0 = default (256 MiB), -1 = unbounded.
    max_total_bytes: 268435456
    # Largest SSE event that is tracked; a larger event stops tracking that
    # stream (the stream itself is not affected). 0 = default (1 MiB).
    max_event_bytes: 1048576
